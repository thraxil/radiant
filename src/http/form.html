<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radiant: upload image</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 36rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
  form { display: grid; gap: 1rem; }
  label { display: grid; gap: .25rem; font-weight: 600; }
  input[type=text], input[type=password] { font: inherit; padding: .4rem; }
  small { font-weight: normal; opacity: .75; }
  button { font: inherit; padding: .5rem 1rem; justify-self: start; cursor: pointer; }
</style>
</head>
<body>
<h1>Upload image</h1>
<form method="post" action="/" enctype="multipart/form-data">
  <label>Image <input type="file" name="image" accept="image/*" required></label>
  {{KEY_FIELD}}
  <label>Sizes to pre-create <small>comma-separated, e.g. <code>100s,640w</code></small>
    <input type="text" name="size_hints"></label>
  <button type="submit">Upload</button>
</form>
</body>
</html>
