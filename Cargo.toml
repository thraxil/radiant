[package]
name = "radiant"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.2"
clap = { version = "4.6.10", features = ["derive", "env"] }
fast_image_resize = { version = "6.2.0", features = ["image"] }
httpdate = "1.0.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
libwebp-sys = "0.9"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
object_store = { version = "0.14.2", default-features = false, features = ["aws", "fs"] }
percent-encoding = "2.3.2"
png = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "multipart", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "limit", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
webp = "0.3"

# Image decoding and resizing are very slow without optimisation. Optimise dependencies even in
# dev builds; our own crate stays at opt-level 0 so it compiles quickly.
[profile.dev.package."*"]
opt-level = 3
