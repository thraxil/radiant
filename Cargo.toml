[package]
name = "radiant"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
axum = "0.8.9"
clap = { version = "4.6.10", features = ["derive", "env"] }
fast_image_resize = { version = "6.2.0", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
percent-encoding = "2.3.2"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
webp = "0.3.1"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

# Image decoding and resizing are very slow without optimisation. Optimise dependencies even in
# dev builds; our own crate stays at opt-level 0 so it compiles quickly.
[profile.dev.package."*"]
opt-level = 3
