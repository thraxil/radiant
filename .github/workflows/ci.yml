name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.24.3
      - uses: Swatinem/rust-cache@v2.9.3
      - name: fmt
        run: nix develop --command cargo fmt --check
      - name: clippy
        run: nix develop --command cargo clippy --all-targets --locked -- -D warnings
      - name: test
        run: nix develop --command cargo test --locked
      - name: test against S3 (versitygw)
        run: nix develop --command scripts/test-s3.sh
      - name: test against a Cask cluster
        run: nix develop --command scripts/test-cask.sh

  docker:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
        with:
          # Pinned: otherwise it uses whatever buildx the runner image ships.
          version: v0.39.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
